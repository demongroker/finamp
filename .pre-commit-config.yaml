repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format .
        language: system
        files: \.(dart)$
      - id: dart-analyze
        name: dart analyze
        entry: flutter analyze
        language: system
        files: \.(dart)$